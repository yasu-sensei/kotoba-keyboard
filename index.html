<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ことばキーボード</title><style>
:root{font-family:'Noto Sans JP','Yu Gothic',sans-serif;color:#233451}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e9f7ff,#fff3df);overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation;border:2px solid #cbdcf0;border-radius:13px;background:white;color:#243852;font-weight:800;box-shadow:0 3px 0 #cbdcf0}button:active{transform:translateY(2px);box-shadow:0 1px 0 #cbdcf0}button:focus-visible{outline:3px solid #358aff}#app{height:100dvh;display:flex;flex-direction:column;gap:7px;padding:9px 12px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}h1{font-size:clamp(17px,2.2vw,25px);margin:0;color:#225d89}.hint{font-size:12px;color:#61758d}#editor{height:clamp(84px,23vh,185px);flex-shrink:0;overflow-y:auto;overscroll-behavior:contain;white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:3px solid #7fb9f0;border-radius:15px;padding:9px 12px;font-size:28px;line-height:1.5;position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:text}#editor .letter{white-space:pre-wrap}#editor .cursor{display:inline-block;width:2px;height:1.15em;background:#1479ed;vertical-align:-.19em;animation:blink 1s steps(1) infinite}#editor .placeholder{color:#a2acb9}@keyframes blink{50%{opacity:0}}.tabs{display:flex;gap:5px;justify-content:center;flex-shrink:0;min-width:0}.tabs .tab{padding:8px clamp(5px,1.1vw,14px);white-space:nowrap;font-size:clamp(12px,1.55vw,19px)}.tab{padding:8px 24px;font-size:clamp(15px,2vw,21px);background:#f2f7ff}.classroom-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:2px solid #87b99a;border-radius:13px;background:#dcf7e5;color:#195d36;font-weight:800;padding:8px 17px;font-size:clamp(14px,1.8vw,20px);white-space:nowrap}.classroom-link:focus-visible{outline:3px solid #358aff}.tab.active{background:#277fc9;color:white;border-color:#277fc9;box-shadow:0 3px 0 #17568b}.keyboard{min-height:0;flex:1;display:flex;align-items:stretch;gap:8px}.side{display:flex;flex-direction:column;gap:7px;flex:0 0 clamp(85px,12vw,150px)}.side button{flex:1;min-height:0;font-size:clamp(13px,1.7vw,20px);padding:2px 4px}.side.left button{background:#f4eaff;border-color:#cdb5ec}.side.right button{background:#e8f5ff;border-color:#a8d1f3}.side.right .copy{background:#bdf2c8;border-color:#66c98a;color:#12592d}.mainkeys{flex:1;min-width:0;display:flex;flex-direction:row-reverse;justify-content:space-evenly;gap:clamp(3px,.65vw,10px)}.keycol{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.keycol button{flex:1;min-height:0;min-width:0;font-size:clamp(18px,2.9vw,33px);padding:0}.keycol .blank{flex:1}.kanji .keycol{gap:4px}.kanji .keycol button{font-size:clamp(14px,2vw,24px);border-radius:8px}.bottom{font-size:12px;color:#63738a;text-align:center;flex-shrink:0}.toast{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:#173f65;color:white;border-radius:16px;padding:18px 25px;font-size:22px;font-weight:bold;z-index:10;box-shadow:0 10px 35px #1235;pointer-events:none}.hidden{display:none!important}.modalshade{position:fixed;inset:0;background:#172f4a99;display:flex;align-items:center;justify-content:center;z-index:20}.modal{background:white;border-radius:20px;padding:26px;max-width:90vw;text-align:center;box-shadow:0 15px 45px #0003}.modal h2{font-size:23px}.modal p{color:#5b6575}.modalbuttons{display:flex;gap:15px;justify-content:center}.modalbuttons button{padding:12px 30px;font-size:20px}.danger{background:#ffdddd;border-color:#f4aaaa}@media(max-width:850px){.tabs{gap:4px}.tab{padding:6px 10px}.classroom-link{padding:6px 9px}}@media(max-height:580px){#app{gap:4px;padding:5px 8px}header h1{font-size:17px}.hint,.bottom{display:none}#editor{height:23vh;font-size:24px;padding:4px 9px}.tabs .tab{padding:4px 7px}.keyboard{gap:5px}.side,.keycol{gap:3px}.keycol button{border-radius:8px}}@media(max-width:760px){.side{flex-basis:78px}.side button{font-size:12px}.keycol button{font-size:17px}.kanji .keycol button{font-size:13px}.mainkeys{gap:2px}#app{padding:5px}}
</style></head><body><div id="app"><header><h1>🌷 ことば キーボード</h1><span class="hint">ぶんの すきな ところを タッチしてね</span></header><div id="editor" aria-label="入力した文章。タップしてカーソル移動" role="textbox" aria-multiline="true"></div><nav class="tabs" aria-label="文字の種類"><button class="tab active" data-mode="hira">ひらがな</button><button class="tab" data-mode="kata">カタカナ</button><button class="tab" data-mode="kanji">1年かん字</button><button class="tab" data-mode="kanji2a">2年かん字①</button><button class="tab" data-mode="kanji2b">2年かん字②</button><button class="tab" data-mode="number">すうじ</button><a class="classroom-link" href="https://classroom.google.com/c/ODY0MDgzNzA3ODg4" target="_blank" rel="noopener noreferrer">クラスルーム ↗</a></nav><div class="keyboard"><div class="side left"><button data-action="dakuten">゛<small> てんてん</small></button><button data-action="handakuten">゜<small> まる</small></button><button data-action="small">小さく</button><button data-action="long">ー</button><button data-action="newline">↵ かいぎょう</button></div><div class="mainkeys" id="keys"></div><div class="side right"><button data-action="backspace">ひともじ<br>けす</button><button data-action="clear">ぜんぶ<br>けす</button><button class="copy" data-action="copy">📋<br>コピーする</button></div></div><div class="bottom">コピーした ぶんは、クラスルームや ドキュメントに はりつけられるよ</div></div><div id="toast" class="toast hidden" role="status"></div><div id="modal" class="modalshade hidden"><div class="modal"><h2>かいた ぶんを<br>ぜんぶ けしますか？</h2><p>けすと、もとに もどせません。</p><div class="modalbuttons"><button id="cancel">やめる</button><button id="confirm" class="danger">けす</button></div></div></div><script>
(()=>{'use strict';const STORE='grade1-kotoba-keyboard-v2';const HIRA=['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','や　ゆ　よ','らりるれろ','わをん、。'];const NUMBERS=['12345','67890','＋－×÷＝','（）？！'];const KANJI='木大小一二三四五六七八九十子空先生男女手天青文字正見学校山水雨上下日火田川竹月車人気糸目玉村白土音花休虫金本森出中町入赤耳王口年立草名夕百円千犬早貝林右足石左力';const KANJI2='引羽雲園遠何科夏家歌画回会海絵外角楽活間丸岩顔汽記帰弓牛魚京強教近兄形計元言原戸古午後語工公広交光考行高黄合谷国黒今才細作算止市矢姉思紙寺自時室社弱首秋週春書少場色食心新親図数西声星晴切雪船線前組走多太体台地池知茶昼長鳥朝直通弟店点電刀冬当東答頭同道読内南肉馬売買麦半番父風分聞米歩母方北毎妹万明鳴毛門夜野友用曜来里理話';const editor=document.getElementById('editor'),keys=document.getElementById('keys');let value='';try{value=localStorage.getItem(STORE)||''}catch(e){}let caret=[...value].length,mode='hira',toastTimer;const chars=()=>[...value];const persist=()=>{try{localStorage.setItem(STORE,value)}catch(e){notify('ほぞん できませんでした')}};function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),1800)}function drawEditor(){const arr=chars();caret=Math.max(0,Math.min(caret,arr.length));editor.replaceChildren();if(!arr.length){const p=document.createElement('span');p.className='placeholder';p.textContent='ここに ぶんが でるよ';editor.append(p)}for(let i=0;i<=arr.length;i++){if(i===caret){const cursor=document.createElement('span');cursor.className='cursor';cursor.setAttribute('aria-hidden','true');editor.append(cursor)}if(i<arr.length){const s=document.createElement('span');s.className='letter';s.textContent=arr[i];s.dataset.index=i;editor.append(s)}}const c=editor.querySelector('.cursor');if(c){const top=c.offsetTop, bottom=top+c.offsetHeight;if(top<editor.scrollTop)editor.scrollTop=Math.max(0,top-20);else if(bottom>editor.scrollTop+editor.clientHeight)editor.scrollTop=bottom-editor.clientHeight+20}}function update(text,pos){value=text;caret=pos;persist();drawEditor()}function insert(t){const a=chars();a.splice(caret,0,...[...t]);update(a.join(''),caret+[...t].length)}function backspace(){if(caret<1)return;const a=chars();a.splice(caret-1,1);update(a.join(''),caret-1)}function replacePrevious(map){if(!caret)return;const a=chars(),old=a[caret-1],next=map[old];if(next){a[caret-1]=next;update(a.join(''),caret)}else notify('この もじは かえられないよ')}
const dak={},han={},sm={};function pairs(from,to,obj){[...from].forEach((x,i)=>obj[x]=[...to][i])}pairs('かきくけこさしすせそたちつてとはひふへほ','がぎぐげござじずぜぞだぢづでどばびぶべぼ',dak);pairs('カキクケコサシスセソタチツテトハヒフヘホ','ガギグゲゴザジズゼゾダヂヅデドバビブベボ',dak);pairs('はひふへほ','ぱぴぷぺぽ',han);pairs('ハヒフヘホ','パピプペポ',han);pairs('あいうえおつやゆよわ','ぁぃぅぇぉっゃゅょゎ',sm);pairs('アイウエオツヤユヨワ','ァィゥェォッャュョヮ',sm);for(const map of [dak,han,sm])for(const [a,b] of Object.entries({...map}))map[b]=a;function renderKeys(){keys.className='mainkeys'+(mode.startsWith('kanji')?' kanji':'');keys.replaceChildren();let columns=mode.startsWith('kanji')?Array.from({length:16},(_,i)=>[...(mode==='kanji'?KANJI:mode==='kanji2a'?KANJI2.slice(0,80):KANJI2.slice(80))].slice(i*5,i*5+5)):mode==='number'?NUMBERS.map(col=>[...col]):HIRA.map(col=>mode==='kata'?[...col].map(c=>c==='　'||c==='、'||c==='。'?c:String.fromCharCode(c.charCodeAt(0)+96)): [...col]);for(const column of columns){const wrap=document.createElement('div');wrap.className='keycol';for(const c of column){if(c==='　'){const blank=document.createElement('div');blank.className='blank';wrap.append(blank);continue}const b=document.createElement('button');b.textContent=c;b.type='button';b.addEventListener('click',()=>insert(c));wrap.append(b)}keys.append(wrap)}}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderKeys()}));async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    try{await navigator.clipboard.writeText(text);return true}catch(e){console.warn('Clipboard API failed',e)}
  }
  // ローカルHTMLや権限制限時の互換コピー。ユーザーのボタン操作中に同期実行する。
  const field=document.createElement('textarea');
  field.value=text;field.setAttribute('readonly','');
  field.style.cssText='position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;z-index:-1';
  document.body.appendChild(field);
  field.focus();field.select();field.setSelectionRange(0,field.value.length);
  let success=false;
  try{success=document.execCommand('copy')}catch(e){console.warn('Fallback copy failed',e)}
  field.remove();return success;
}
function showManualCopy(text){
  let overlay=document.getElementById('manualCopy');
  if(!overlay){overlay=document.createElement('div');overlay.id='manualCopy';overlay.className='modalshade';overlay.innerHTML='<div class="modal" style="width:min(90vw,640px)"><h2>コピーできなかったよ</h2><p>下の文章を長押しして「コピー」をえらんでね。</p><textarea id="manualText" readonly style="width:100%;height:150px;font-size:22px;border:2px solid #7fb9f0;border-radius:10px;padding:8px"></textarea><div class="modalbuttons"><button id="manualClose">とじる</button></div></div>';document.body.appendChild(overlay);document.getElementById('manualClose').onclick=()=>overlay.remove()}
  const field=document.getElementById('manualText');field.value=text;field.focus();field.select();
}
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async()=>{switch(b.dataset.action){case'dakuten':replacePrevious(dak);break;case'handakuten':replacePrevious(han);break;case'small':replacePrevious(sm);break;case'long':insert('ー');break;case'newline':insert('\n');break;case'backspace':backspace();break;case'clear':document.getElementById('modal').classList.remove('hidden');break;case'copy':if(!value){notify('ぶんを かいてね');break}if(await copyText(value)){notify('コピーできたよ！')}else{showManualCopy(value)}break}}));document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.add('hidden');document.getElementById('confirm').onclick=()=>{document.getElementById('modal').classList.add('hidden');update('',0);notify('ぜんぶ けしたよ')};editor.addEventListener('click',e=>{const span=e.target.closest?.('.letter');if(span){const rect=span.getBoundingClientRect();caret=Number(span.dataset.index)+(e.clientX>rect.left+rect.width/2?1:0)}else if(e.target===editor){const spans=[...editor.querySelectorAll('.letter')];if(!spans.length)caret=0;else{let best=Infinity,chosen=chars().length;for(const s of spans){const r=s.getBoundingClientRect(),y=Math.max(r.top,Math.min(e.clientY,r.bottom)),x=Math.max(r.left,Math.min(e.clientX,r.right)),d=(x-e.clientX)**2+(y-e.clientY)**2;if(d<best){best=d;chosen=Number(s.dataset.index)+(e.clientX>r.left+r.width/2?1:0)}}caret=chosen}}drawEditor()});
// 物理キーボード連携（画面キーボードの既存処理は変更しない）
function moveVertical(direction){
  const spans=[...editor.querySelectorAll('.letter')];
  if(!spans.length)return;
  const cursor=editor.querySelector('.cursor');
  if(!cursor)return;
  const cr=cursor.getBoundingClientRect();
  const targetY=cr.top+direction*Math.max(cr.height,24);
  const x=cr.left;
  let best=Infinity,position=caret;
  for(const span of spans){
    const rect=span.getBoundingClientRect();
    const cy=(rect.top+rect.bottom)/2;
    if(direction<0 && cy>=cr.top-2)continue;
    if(direction>0 && cy<=cr.top+2)continue;
    const distance=Math.abs(cy-targetY)*1000+Math.abs(rect.left-x);
    if(distance<best){
      best=distance;
      position=Number(span.dataset.index)+(x>rect.left+rect.width/2?1:0);
    }
  }
  if(best<Infinity){caret=position;drawEditor()}
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
  if(e.target instanceof HTMLElement && e.target.closest('textarea,input,[contenteditable="true"]'))return;
  let handled=true;
  switch(e.key){
    case 'Backspace':backspace();break;
    case 'Delete':{
      const a=chars();
      if(caret<a.length){a.splice(caret,1);update(a.join(''),caret)}
      break;
    }
    case 'Enter':insert('\\n');break;
    case 'ArrowLeft':caret=Math.max(0,caret-1);drawEditor();break;
    case 'ArrowRight':caret=Math.min(chars().length,caret+1);drawEditor();break;
    case 'ArrowUp':moveVertical(-1);break;
    case 'ArrowDown':moveVertical(1);break;
    default:
      if(/^[0-9]$/.test(e.key))insert(e.key);
      else handled=false;
  }
  if(handled)e.preventDefault();
});
renderKeys();drawEditor();})();
</script></body></html>
